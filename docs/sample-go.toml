# Plantilla de ejemplo de templet: un servicio Go minimo y compilable.
#
# templet es agnostico del lenguaje: emite archivos de texto en las rutas que
# declares. Esta plantilla usa Go solo como demostracion.
#
# Campos opcionales de cada archivo:
#   when   = plantilla que se evalua como booleano; si es falso, el archivo no
#            se genera (y la generacion continua con el siguiente).
#   delims = par de delimitadores propios del archivo. Necesario cuando el
#            contenido debe contener llaves literales, por ejemplo las
#            expresiones `${{ ... }}` de GitHub Actions. El par elegido aplica
#            al `path` Y al `content` de ese archivo.
#   replaces = reemplazos literales aplicados al contenido ya renderizado.
#   mode   = permisos del archivo en octal (por ejemplo "0755"). Si se omite,
#            el archivo se escribe con 0644.

variables = ["Name", "ModulePath", "WithCI"]

[[files]]
path = "{{ .Name }}/README.md"
content = '''
# {{ .Name }}

Proyecto generado con templet.

## Uso

```sh
go run .
```
'''

[[files]]
path = "{{ .Name }}/go.mod"
content = '''
module {{ .ModulePath }}

go 1.26
'''

[[files]]
path = "{{ .Name }}/main.go"
content = '''
package main

import "fmt"

func main() {
	fmt.Println("{{ .Name }}")
}
'''

# Ejemplo de archivo ejecutable: `mode` es un literal octal opcional.
[[files]]
path = "{{ .Name }}/scripts/build.sh"
mode = "0755"
content = '''
#!/bin/sh
set -eu
cd "$(dirname "$0")/.."
go build -o bin/{{ .Name }} .
'''

# Solo se genera si WithCI es verdadero ("yes", "true", "1", "on", ...).
# El path usa los delims del archivo (`[[ ]]`), no `{{ }}`.
[[files]]
path = "[[ .Name ]]/.github/workflows/ci.yml"
when = "[[ .WithCI ]]"
delims = ["[[", "]]"]
content = '''
name: [[ .Name ]] CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-[[ .Name ]]-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cache de modulos
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Test
        run: go test ./...
'''
